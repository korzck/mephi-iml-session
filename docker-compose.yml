version: '3.8'

services:
  # Основной ML-сервис
  ml-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: credit-card-ml-service
    ports:
      - "5000:5000"
    environment:
      - MODEL_PATH=/app/models/model_v1.pkl
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]

      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ml-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # сервис для мониторинга (сбор логов)
  log-collector:
    image: nginx:alpine
    container_name: log-collector
    ports:
      - "8080:80"
    volumes:
      - ./logs:/var/log/nginx
    networks:
      - ml-network
    depends_on:
      - ml-service

  # имитация брокера сообщений (RabbitMQ) для демонстрации концепции
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - ml-network
    profiles:
      - with-broker # опциональный профиль

networks:
  ml-network:
    driver: bridge